<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ramadan Light | Login</title>
  <link rel="stylesheet" href="css.css" />
</head>
<body>

  <div class="navbar">
    <div class="wrap nav-row">
      <a class="brand" href="index.html">
        <img src="images/log.png" alt="Ramadan Light logo" class="brand-logo">
        <div class="brand-text">
          <div class="brand-name">Ramadan Light</div>
          <div class="brand-sub">HEALTHY RECIPES</div>
        </div>
      </a>

      <div class="nav-links">
        <a class="link" href="index.html">Home</a>
        <a class="btn btn-primary" href="signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <div class="page-bg">
    <div class="wrap">
      <div class="form-card">
        <h1 class="form-title">Login</h1>
        <p class="form-sub">Welcome back! Let’s keep it healthy today.</p>

       
        <form method="get">
          <div class="field">
            <label>Email Address</label>
            <div class="input-row">
              <span class="mini-icon">✉</span>
              <input type="email" placeholder="Enter your email" required />
            </div>
          </div>

          <div class="field">
            <label>Password</label>
            <div class="input-row">
              <span class="mini-icon">🔒</span>
              <input type="password" placeholder="Enter your password" required />
            </div>
          </div>

          
          <button class="btn btn-primary full" type="submit" formaction="user.html">
            Login as User →
          </button>

          <button class="btn btn-outline full" type="submit" formaction="admin.html">
            Login as Admin →
          </button>
        </form>

        <div class="divider">
          <div class="line"></div>
          <div class="divider-text">New to Ramadan Light?</div>
          <div class="line"></div>
        </div>

        <div class="center">
          <a class="link" href="signup.html">Sign up</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
