<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ramadan Light | Add Recipe</title>
  <link rel="stylesheet" href="css.css" />
</head>
<body id="add-recipe-page">

 <div class="navbar">
    <div class="wrap nav-row">
      <a class="brand" href="index.html">
        <img src="images/log.png" alt="Ramadan Light logo" class="brand-logo">
        <div class="brand-text">
          <div class="brand-name">Ramadan Light</div>
          <div class="brand-sub">HEALTHY RECIPES</div>
        </div>
      </a>

      <div class="nav-links">
        <a class="link" href="index.html">Home</a>
        <a class="btn btn-primary" href="index.html">Sign out</a>
      </div>
    </div>
  </div>

  <!-- Page Content -->
  
 <h1 id="add-recipe-title">Add New Recipe</h1>
 
  <main class="page" id="add-recipe-content">

    <form class="card" id="add-recipe-form" action="my-recipes.html">
      
      <label for="add-recipe-name">Recipe name</label>
      <input type="text" id="add-recipe-name" required />

      <label for="add-recipe-category">Category</label>
      <select id="add-recipe-category" required>
        <option value="">Select category</option>
        <option value="Suhoor">Suhoor</option>
        <option value="Iftar">Iftar</option>
        <option value="Snacks">Snacks</option>
      </select>

      <label for="add-recipe-description">Description</label>
      <textarea id="add-recipe-description" rows="3" required></textarea>

      <label for="add-recipe-photo">Photo</label>
      <input type="file" id="add-recipe-photo" accept="image/*" required />

      <!-- Ingredients -->
      <label>Ingredients</label>
<div id="add-recipe-ingredients-container">
  <div class="ingredient-row">
    <span class="ingredient-number">1.</span>
    <input
      type="text"
      class="ingredient-name"
      placeholder="Ingredient name"
      required
    />
    <input
      type="text"
      class="ingredient-qty"
      placeholder="Quantity"
      required
    />
  </div>
</div>

<button
  type="button"
  class="add-recipe-btn-secondary"
  id="add-ingredient-btn">
  + Add new ingredient
</button>

      <!-- Instructions -->
      <label>Instructions</label>
<div id="add-recipe-steps-container">
  <div class="step-row">
    <span class="step-number">1.</span>
    <input
      type="text"
      class="step-input"
      placeholder="Step description"
      required
    />
  </div>
</div>

<button
  type="button"
  class="add-recipe-btn-secondary"
  id="add-step-btn">
  + Add new step
</button>

	  <label for="add-recipe-video-file">Upload video or URL (optional)</label>
		<input
		type="file"
		id="add-recipe-video-file"
		accept="video/*"
		/>
      <input
        type="url"
        id="add-recipe-video"
        placeholder="https://youtube.com/..." />

      <div class="actions" id="add-recipe-actions">
        <button type="submit" class="add-recipe-btn-primary" id="add-recipe-submit-recipe">
          Add Recipe
        </button>
        <a href="my-recipes.html" class="add-recipe-btn-secondary" id="cancel-add-recipe">
          Cancel
        </a>
      </div>

    </form>
  </main>

  <div class="footer">
    <div class="wrap footer-row">
      <div class="footer-mark">☾</div>
      <div>© 2026 Ramadan Light — Nourishing bodies and souls.</div>
    </div>
  </div>
  
  <script src="js.js"></script>
</body>
</html>
