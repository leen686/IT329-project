<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VS Code Test</title>

    <!-- لازم يطابق اسم ملف الـ CSS -->
    <link rel="stylesheet" href="Leen.css" />
  </head>

  <body>
    <header class="card">
      <h1>تجربة VS Code </h1>
      <p id="status">جاهز</p>
    </header>

    <main class="card">
      <label for="name">اسمك:</label>
      <input id="name" type="text" placeholder="اكتب اسمك..." />

      <div class="row">
        <button id="btnHello" type="button">سلّم علي</button>
        <button id="btnToggle" type="button">بدّل الوضع</button>
        <button id="btnReset" type="button">Reset</button>
      </div>

      <p id="msg">اضغط زر “سلّم علي”</p>

      <hr />

      <h2>قائمة سريعة</h2>
      <ul id="list"></ul>
    </main>

    <!-- لازم يطابق اسم ملف الـ JS -->
    <script defer src="Leen.js"></script>
  </body>
</html>
